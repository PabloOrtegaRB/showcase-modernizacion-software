name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar, probar y medir cobertura
        run: ./mvnw -B verify
      - name: Medir rendimiento (informativo)
        run: java -cp target/classes cl.valdora.modernizacion.herramientas.Rendimiento target/rendimiento 26
      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            target/site/jacoco
            target/rendimiento
